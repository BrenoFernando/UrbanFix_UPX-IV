<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Entrar - UrbanFix</title>
  <link rel='stylesheet' href='/css/style.css'>
</head>
<body>
<nav id='menu'></nav>
<main>
  <div class='card'>
    <h2>Entrar</h2>
    <select id='tipo' aria-label='Tipo de conta'>
      <option value='moradores'>Sou morador</option>
      <option value='prefeituras'>Sou da prefeitura</option>
    </select>
    <input id='email' type='email' placeholder='E-mail' aria-label='E-mail'>
    <input id='senha' type='password' placeholder='Senha' aria-label='Senha'>
    <button class='btn' id='btnEntrar'>Entrar</button>
    <p id='msg' class='erro'></p>
    <p style='text-align:center'>Não tem cadastro? <a href='/cadastro.html'>Cadastre aqui</a></p>
  </div>
</main>
<script src='/js/api.js'></script>
<script>
  menu();
 
  if (new URLSearchParams(location.search).get('cadastro') === 'ok') {
    $('msg').className = 'ok';
    $('msg').textContent = 'Cadastro feito! Agora é só entrar.';
  }
 
  $('btnEntrar').onclick = async () => {
    try {
      const s = await api('/' + $('tipo').value + '/login', {
        method: 'POST',
        body: { email: $('email').value, senha: $('senha').value },
      });
      salvarSessao(s);
      location.href = s.usuario.tipo === 'prefeitura' ? '/painel.html' : '/';
    } catch (e) {
      $('msg').className = 'erro';
      $('msg').textContent = e.message;
    }
  };
 
  $('senha').onkeydown = (e) => { if (e.key === 'Enter') $('btnEntrar').click(); };
</script>
</body>
</html>
